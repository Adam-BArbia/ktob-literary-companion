name: Add pinned Supabase JS dependency once
on:
  push:
    paths:
      - '.github/workflows/add-supabase-js-once.yml'
permissions:
  contents: write

jobs:
  add-supabase-client:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lock official Supabase JavaScript v2 dependency
        working-directory: apps/web
        run: |
          npm ci
          npm install --save-exact '@supabase/supabase-js@2'
          npm test -- --watch=false
          npm run build
      - name: Commit verified lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --quiet && exit 1
          git commit -m 'chore(web): pin Supabase Auth client dependency and lockfile'
          git push origin HEAD:main
