name: KTOB Java API (Java 21)
on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  api-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify Maven Wrapper version
        run: ./mvnw -version
      - name: Compile, test and package KTOB API
        run: ./mvnw -B -ntp clean verify
      - name: Confirm runnable Spring Boot jar exists
        run: test -n "$(find target -maxdepth 1 -name 'ktob-api-*.jar' ! -name '*.original' -print -quit)"
