name: Bootstrap Angular 22 once
on:
  push:
    paths:
      - '.github/workflows/bootstrap-web-once.yml'
permissions:
  contents: write

jobs:
  generate-angular-project:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate pinned Angular 22 project
        run: |
          test ! -f apps/web/package-lock.json
          npx --yes @angular/cli@22.3.0 new ktob-web \
            --directory=apps/web --routing --style=css --standalone \
            --skip-git --ssr=false --test-runner=vitest \
            --package-manager=npm --defaults
      - name: Add official Tailwind v4 PostCSS integration
        run: |
          cd apps/web
          npm install --save-dev 'tailwindcss@^4' '@tailwindcss/postcss@^4' 'postcss@^8'
          printf '%s\n' '{"plugins":{"@tailwindcss/postcss":{}}}' > .postcssrc.json
          printf '%s\n' '@import "tailwindcss";' > src/styles.css
      - name: Verify npm lockfile, unit tests and production build
        run: |
          cd apps/web
          npm ci
          npx ng test --watch=false
          npx ng build --configuration production
          test -f package-lock.json
      - name: Commit generated, verified project and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web
          git diff --cached --quiet && exit 1
          git commit -m "chore(web): generate Angular 22 standalone Vitest workspace with Tailwind and lockfile"
          git push origin HEAD:main
