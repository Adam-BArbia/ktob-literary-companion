name: Validate KTOB architecture documentation
on:
  push:
    paths:
      - 'docs/uml/**'
      - 'docs/architecture/**'
      - '.github/workflows/uml-validation.yml'
  pull_request:
    paths:
      - 'docs/uml/**'
      - 'docs/architecture/**'
      - '.github/workflows/uml-validation.yml'
permissions:
  contents: read
jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned PlantUML CLI
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/plantuml/plantuml/releases/download/v1.2025.4/plantuml-1.2025.4.jar \
            -o "$RUNNER_TEMP/plantuml.jar"
      - name: Validate all UML syntax
        run: java -jar "$RUNNER_TEMP/plantuml.jar" -checkonly -stdrpt docs/uml/*.puml
      - name: Install Graphviz rendering binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz
      - name: Render all 16 diagrams
        run: |
          command -v dot
          dot -V
          export GRAPHVIZ_DOT="$(command -v dot)"
          mkdir -p "$RUNNER_TEMP/uml-output"
          java -jar "$RUNNER_TEMP/plantuml.jar" -tsvg -o "$RUNNER_TEMP/uml-output" docs/uml/*.puml
          test "$(find "$RUNNER_TEMP/uml-output" -maxdepth 1 -name '*.svg' | wc -l)" -eq 16
          if grep -r -E -i "cannot run program|syntax error|graphviz error" "$RUNNER_TEMP/uml-output"/*.svg; then
            echo "PlantUML generated an error diagram" >&2
            exit 1
          fi
      - name: Install pinned JSON Schema validator
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-validation"
          "$RUNNER_TEMP/schema-validation/bin/python" -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Parse JSON and cross-check contracts
        run: |
          python3 -m json.tool docs/architecture/openapi.json > /dev/null
          "$RUNNER_TEMP/schema-validation/bin/python" docs/architecture/validate_contract.py
      - name: Install pinned OpenAPI parser
        run: |
          npm install --prefix "$RUNNER_TEMP/openapi-validation" --no-save \
            --package-lock=false --ignore-scripts @apidevtools/swagger-parser@10.1.1
      - name: Validate OpenAPI 3.1 schema and references
        run: |
          node - "$RUNNER_TEMP/openapi-validation/node_modules/@apidevtools/swagger-parser" docs/architecture/openapi.json <<'NODE'
          const Parser = require(process.argv[2]);
          Parser.validate(process.argv[3]).then(() => {
            console.log("OpenAPI parser validation passed");
          }).catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
